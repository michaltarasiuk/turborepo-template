packages:
  - "apps/*"
  - "packages/*"

# Every dependency version must come from the catalog below
catalogMode: strict

# Supply-chain hardening
minimumReleaseAge: 1440 # minutes; skip versions published in the last 24h
trustPolicy: no-downgrade # reject versions with weaker provenance than earlier ones
blockExoticSubdeps: true # transitive deps may not come from git or tarball URLs
strictDepBuilds: true # fail on install scripts that are not explicitly allowed

allowBuilds:
  lefthook: true # postinstall installs the Git hooks

catalog:
  "@tailwindcss/postcss": 4.3.3
  "@types/node": 24.19.2
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.5
  eslint-plugin-turbo: 2.11.8
  lefthook: 2.2.1
  next: 16.3.8
  oxfmt: 0.73.0
  oxlint: 1.88.0
  postcss: 8.5.30
  postcss-load-config: 6.0.1
  react: 19.2.8
  react-aria-components: 1.22.1
  react-dom: 19.2.8
  tailwind-merge: 3.7.0
  tailwind-variants: 3.3.1
  tailwindcss: 4.3.3
  tailwindcss-react-aria-components: 2.2.0
  turbo: 2.11.8
  typescript: 7.0.2
